<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 Not Found</title>

  <!-- Red 404 SVG Favicon -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230A0A0A'/%3E%3Ctext x='50%25' y='57%25' dominant-baseline='middle' text-anchor='middle' font-family='Arial, sans-serif' font-weight='bold' font-size='38' fill='%23EF4444'%3E404%3C/text%3E%3C/svg%3E">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      background-color: #080C10;
      color: #E2E8F0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center text-center px-6">

  <div class="max-w-xl mx-auto">
    <!-- Red Badge -->
    <span class="inline-block bg-red-950/80 border border-red-500/30 text-red-400 text-xs font-semibold px-4 py-1.5 rounded-full mb-6">
      ERROR CODE: 404
    </span>

    <!-- Big 404 Heading -->
    <h1 class="text-6xl md:text-8xl font-black text-red-500 tracking-tight mb-4 drop-shadow-lg">
      404
    </h1>

    <h2 class="text-2xl md:text-3xl font-bold text-white mb-3">
      ERROR NOT FOUND
    </h2>

    <p class="text-slate-400 text-sm md:text-base mb-8">
      This website is not owned by us at this time. The requested page or resource could not be found on this server.
    </p>

    <div class="border-t border-slate-800 pt-6">
      <a href="#" class="text-xs text-slate-500 hover:text-slate-400 transition">
        Server Status: Offline / Unclaimed
      </a>
    </div>
  </div>

</body>
</html>
